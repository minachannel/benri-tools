<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>ローン返済計算（無料） | 便利ツール</title><meta name="description" content="借入額・金利・返済年数から毎月返済額と総返済額を無料で概算。"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><nav aria-label="計算ツールを選択"><a href="salary.html">給料計算</a><a href="split.html">割り勘計算</a><a href="fuel.html">燃費計算</a><a href="loan.html" aria-current="page">ローン返済計算</a><a href="calendar.html">📅 カレンダー</a></nav><section><h2>ローン返済計算</h2><p class="hint">元利均等返済・固定金利・毎月末返済の概算。手数料・ボーナス返済は含みません。</p><label for="principal">借入額（万円）<input id="principal" type="number" min="0" step="0.1" value="2000" inputmode="decimal"></label><label for="rate">年利（%）<input id="rate" type="number" min="0" step="0.01" value="2" inputmode="decimal"></label><label for="years">返済期間（年）<input id="years" type="number" min="1" step="1" value="35" inputmode="decimal"></label><button class="calc" data-calc="loan">計算する</button><div class="result" id="result" aria-live="polite"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。借入2,000万円、年利2%、35年の場合の返済額を試算できます。</p></section><script src="app.js" defer></script></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer></body></html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#2563eb" name="theme-color"/><title>割り勘計算（無料） | 便利ツール</title><meta content="合計金額と人数から1人あたりの割り勘額を無料計算。" name="description"/><link href="style.css?v=173" rel="stylesheet"/></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><section><h2>割り勘計算</h2><p class="hint">1人あたりの金額を1円単位で切り上げます。切り上げた分、合計が元の金額を上回ることがあります。</p><label for="bill">合計金額（円）<input id="bill" inputmode="decimal" min="0" step="1" type="number" value="12000"/></label><label for="people">人数<input id="people" inputmode="decimal" min="1" step="1" type="number" value="4"/></label><button class="calc" data-calc="split">計算する</button><div aria-live="polite" class="result" id="result"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。12,000円を4人で割ると、1人3,000円。</p></section><script defer="" src="app.js"></script><details class="v172-menu"><summary>☰ その他の機能</summary><div class="v172-links"></div></details><button class="v172-settings-btn" data-v172-settings="" type="button">⚙️ 表示する機能を選ぶ</button></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer><script defer="True" src="v17-simple.js?v=172"></script><script defer src="v17-compact.js?v=173"></script></body></html>

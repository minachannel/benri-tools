<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>割り勘計算（無料） | 便利ツール</title><meta name="description" content="合計金額と人数から1人あたりの割り勘額を無料計算。"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><nav aria-label="計算ツールを選択"><a href="salary.html">給料計算</a><a href="split.html" aria-current="page">割り勘計算</a><a href="fuel.html">燃費計算</a><a href="loan.html">ローン返済計算</a><a href="calendar.html">📅 カレンダー</a></nav><section><h2>割り勘計算</h2><p class="hint">1人あたりの金額を1円単位で切り上げます。切り上げた分、合計が元の金額を上回ることがあります。</p><label for="bill">合計金額（円）<input id="bill" type="number" min="0" step="1" value="12000" inputmode="decimal"></label><label for="people">人数<input id="people" type="number" min="1" step="1" value="4" inputmode="decimal"></label><button class="calc" data-calc="split">計算する</button><div class="result" id="result" aria-live="polite"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。12,000円を4人で割ると、1人3,000円。</p></section><script src="app.js" defer></script></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>給料計算（無料） | 便利ツール</title><meta name="description" content="時給・勤務時間・休憩・出勤日数から月収の目安を無料計算。"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><nav aria-label="計算ツールを選択"><a href="salary.html" aria-current="page">給料計算</a><a href="split.html">割り勘計算</a><a href="fuel.html">燃費計算</a><a href="loan.html">ローン返済計算</a><a href="calendar.html">📅 カレンダー</a></nav><section><h2>給料計算</h2><p class="hint">通常時給による税引前の概算。残業・深夜・休日割増や控除は含みません。</p><label for="wage">時給（円）<input id="wage" type="number" min="0" step="1" value="1200" inputmode="decimal"></label><label for="hours">1日の拘束時間（時間）<input id="hours" type="number" min="0" step="0.5" value="8" inputmode="decimal"></label><label for="break">1日の休憩時間（分）<input id="break" type="number" min="0" step="1" value="60" inputmode="decimal"></label><label for="days">月の出勤日数<input id="days" type="number" min="0" step="1" value="20" inputmode="decimal"></label><button class="calc" data-calc="salary">計算する</button><div class="result" id="result" aria-live="polite"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。時給1200円、拘束8時間、休憩60分、月20日なら168,000円。</p></section><script src="app.js" defer></script></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer></body></html>

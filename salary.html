<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#2563eb" name="theme-color"/><title>給料計算（無料） | 便利ツール</title><meta content="時給・勤務時間・休憩・出勤日数から月収の目安を無料計算。" name="description"/><link href="style.css?v=173" rel="stylesheet"/></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><section><h2>給料計算</h2><p class="hint">通常時給による税引前の概算。残業・深夜・休日割増や控除は含みません。</p><label for="wage">時給（円）<input id="wage" inputmode="decimal" min="0" step="1" type="number" value="1200"/></label><label for="hours">1日の拘束時間（時間）<input id="hours" inputmode="decimal" min="0" step="0.5" type="number" value="8"/></label><label for="break">1日の休憩時間（分）<input id="break" inputmode="decimal" min="0" step="1" type="number" value="60"/></label><label for="days">月の出勤日数<input id="days" inputmode="decimal" min="0" step="1" type="number" value="20"/></label><button class="calc" data-calc="salary">計算する</button><div aria-live="polite" class="result" id="result"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。時給1200円、拘束8時間、休憩60分、月20日なら168,000円。</p></section><script defer="" src="app.js"></script><details class="v172-menu"><summary>☰ その他の機能</summary><div class="v172-links"></div></details><button class="v172-settings-btn" data-v172-settings="" type="button">⚙️ 表示する機能を選ぶ</button></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer><script defer="True" src="v17-simple.js?v=172"></script><script defer src="v17-compact.js?v=173"></script></body></html>

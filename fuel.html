<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#2563eb" name="theme-color"/><title>燃費計算（無料） | 便利ツール</title><meta content="走行距離と給油量から燃費（km/L）を無料計算。" name="description"/><link href="style.css?v=173" rel="stylesheet"/></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><section><h2>燃費計算</h2><p class="hint">満タン法などで測定した走行距離と給油量から計算します。</p><label for="distance">走行距離（km）<input id="distance" inputmode="decimal" min="0" step="0.1" type="number" value="420"/></label><label for="liters">給油量（L）<input id="liters" inputmode="decimal" min="0.01" step="0.01" type="number" value="30"/></label><button class="calc" data-calc="fuel">計算する</button><div aria-live="polite" class="result" id="result"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。420km走行し30L給油した場合、14.00km/L。</p></section><script defer="" src="app.js"></script><details class="v172-menu"><summary>☰ その他の機能</summary><div class="v172-links"></div></details><button class="v172-settings-btn" data-v172-settings="" type="button">⚙️ 表示する機能を選ぶ</button></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer><script defer="True" src="v17-simple.js?v=172"></script><script defer src="v17-compact.js?v=173"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>燃費計算（無料） | 便利ツール</title><meta name="description" content="走行距離と給油量から燃費（km/L）を無料計算。"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><nav aria-label="計算ツールを選択"><a href="salary.html">給料計算</a><a href="split.html">割り勘計算</a><a href="fuel.html" aria-current="page">燃費計算</a><a href="loan.html">ローン返済計算</a><a href="calendar.html">📅 カレンダー</a><a href="finance.html">💳 家計・引き落とし</a></nav><section><h2>燃費計算</h2><p class="hint">満タン法などで測定した走行距離と給油量から計算します。</p><label for="distance">走行距離（km）<input id="distance" type="number" min="0" step="0.1" value="420" inputmode="decimal"></label><label for="liters">給油量（L）<input id="liters" type="number" min="0.01" step="0.01" value="30" inputmode="decimal"></label><button class="calc" data-calc="fuel">計算する</button><div class="result" id="result" aria-live="polite"></div><h2 style="margin-top:28px;font-size:18px">使い方と計算例</h2><p class="explain">必要な数字を入力し「計算する」を押してください。420km走行し30L給油した場合、14.00km/L。</p></section><script src="app.js" defer></script></main><footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer></body></html>

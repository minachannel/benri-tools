<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>便利ツール | 無料計算サイト</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#182438;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#2563eb;color:white;padding:26px 18px}header>div,main,footer{max-width:620px;margin:auto}h1{margin:0;font-size:26px}header p{margin:8px 0 0;color:#e7eeff}main{padding:18px}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}nav button{border:1px solid #d7e0ee;background:white;border-radius:12px;padding:14px 5px;font-size:15px;font-weight:700;color:#27364c}nav button[aria-selected=true]{background:#dceaff;border-color:#2563eb;color:#154db5}section{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 18px #23344a0d}section[hidden]{display:none}h2{margin:0 0 8px;font-size:22px}.hint{color:#536277;font-size:13px;line-height:1.6}label{display:block;margin-top:16px;font-size:14px;font-weight:700}input{width:100%;border:1px solid #c7d2e0;border-radius:10px;padding:12px;margin-top:6px;font-size:18px;color:#152238}button.calc{width:100%;margin-top:22px;border:0;background:#2563eb;color:white;border-radius:12px;padding:15px;font-size:17px;font-weight:700}.result{margin-top:18px;padding:18px;background:#eaf2ff;border-radius:12px;font-size:22px;font-weight:800;overflow-wrap:anywhere}.result:empty{display:none}footer{padding:4px 20px 30px;font-size:12px;color:#65748a;line-height:1.7}</style></head><body>
<header><div><h1>🧮 便利ツール</h1><p>毎日の計算を、もっとかんたんに。</p></div></header><main><nav aria-label="計算ツールを選択"><button aria-selected="true" data-target="salary">💴 給料計算</button><button aria-selected="false" data-target="split">👥 割り勘</button><button aria-selected="false" data-target="fuel">🚗 燃費計算</button><button aria-selected="false" data-target="loan">🏠 ローン計算</button></nav>
<section id="salary"><h2>給料計算</h2><p class="hint">通常時給での税引前の概算。残業・深夜・休日割増や控除は含みません。</p><label>時給（円）<input id="wage" type="number" min="0" value="1200"></label><label>1日の拘束時間（時間）<input id="hours" type="number" min="0" value="8" step="0.5"></label><label>1日の休憩時間（分）<input id="break" type="number" min="0" value="60"></label><label>月の出勤日数<input id="days" type="number" min="0" value="20"></label><button class="calc" data-calc="salary">計算する</button><div class="result" id="salary-result" aria-live="polite"></div></section>
<section id="split" hidden><h2>割り勘計算</h2><p class="hint">1人あたりの支払額を1円単位で切り上げます。</p><label>合計金額（円）<input id="bill" type="number" min="0" value="12000"></label><label>人数<input id="people" type="number" min="1" step="1" value="4"></label><button class="calc" data-calc="split">計算する</button><div class="result" id="split-result" aria-live="polite"></div></section>
<section id="fuel" hidden><h2>燃費計算</h2><p class="hint">満タン法などで測定した走行距離と給油量から計算します。</p><label>走行距離（km）<input id="distance" type="number" min="0" value="420"></label><label>給油量（L）<input id="liters" type="number" min="0.01" value="30" step="0.01"></label><button class="calc" data-calc="fuel">計算する</button><div class="result" id="fuel-result" aria-live="polite"></div></section>
<section id="loan" hidden><h2>ローン返済計算</h2><p class="hint">元利均等返済、毎月末返済、固定金利の概算。手数料・ボーナス返済は含みません。</p><label>借入額（万円）<input id="principal" type="number" min="0" value="2000"></label><label>年利（%）<input id="rate" type="number" min="0" step="0.01" value="2"></label><label>返済期間（年）<input id="years" type="number" min="1" step="1" value="35"></label><button class="calc" data-calc="loan">計算する</button><div class="result" id="loan-result" aria-live="polite"></div></section></main>
<footer>本サイトの計算結果は参考値です。正確な給与額、請求額、融資条件等は契約書や専門家の説明をご確認ください。</footer><script>
const el=id=>document.getElementById(id),num=id=>Number(el(id).value),yen=v=>Math.round(v).toLocaleString('ja-JP')+'円';
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==b.dataset.target)}));
document.querySelectorAll('[data-calc]').forEach(b=>b.addEventListener('click',()=>{const type=b.dataset.calc,out=el(type+'-result');let ids=type==='salary'?['wage','hours','break','days']:type==='split'?['bill','people']:type==='fuel'?['distance','liters']:['principal','rate','years'];if(ids.some(id=>el(id).value.trim()===''||!Number.isFinite(num(id))||num(id)<0)){out.textContent='入力値を確認してください';return}let message='';if(type==='salary'){if(num('break')>num('hours')*60||num('days')>31||num('hours')>24){message='時間や日数を確認してください'}else{message='月収の目安：'+yen(num('wage')*(num('hours')-num('break')/60)*num('days'))}}else if(type==='split'){message=num('people')<1||!Number.isInteger(num('people'))?'人数は1以上の整数で入力してください':'1人あたり：'+yen(Math.ceil(num('bill')/num('people')))}else if(type==='fuel'){message=num('liters')<=0?'給油量は0より大きくしてください':'燃費：'+(num('distance')/num('liters')).toFixed(2)+' km/L'}else{const p=num('principal')*10000,r=num('rate')/1200,n=num('years')*12;if(n<=0||!Number.isInteger(num('years'))||num('years')>100){message='返済期間を確認してください'}else{const payment=r===0?p/n:p*r/(1-Math.pow(1+r,-n));message=Number.isFinite(payment)?'毎月返済：約'+yen(payment)+' ／ 総返済：約'+yen(payment*n):'入力値を確認してください'}}out.textContent=message}));
</script></body></html>
